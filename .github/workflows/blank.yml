
name: StudyLens - Verification iOS

on:
  workflow_dispatch:

jobs:
  verify-ios:
    runs-on: macos-26

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Verifier Xcode
        run: xcodebuild -version

      - name: Verifier Swift
        run: swift --version

      - name: Lister les projets iOS
        run: |
          find . -maxdepth 5 \( -name "*.xcodeproj" -o -name "*.xcworkspace" -o -name "Package.swift" \) -print
