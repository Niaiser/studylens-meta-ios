
name: StudyLens - Build CameraAccess

on:
  workflow_dispatch:

jobs:
  build-camera-access:
    runs-on: macos-26

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Verifier Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Lister les simulateurs iOS
        run: xcrun simctl list devices available

      - name: Compiler CameraAccess
        run: |
          set -o pipefail
          xcodebuild \
            -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/CameraAccessBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build
            
      - name: Compiler CameraAccess pour iPhone
        run: |
          set -o pipefail
          xcodebuild \
            -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/CameraAccessDeviceBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Préparer le paquet iPhone non signé
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/CameraAccessIPA/Payload"
          cp -R "$RUNNER_TEMP/CameraAccessDeviceBuild/Build/Products/Debug-iphoneos/CameraAccess.app" \
            "$RUNNER_TEMP/CameraAccessIPA/Payload/CameraAccess.app"
          cd "$RUNNER_TEMP/CameraAccessIPA"
          zip -r "$RUNNER_TEMP/StudyLens-CameraAccess-unsigned.ipa" Payload

      - name: Archiver le paquet iPhone
        uses: actions/upload-artifact@v4
        with:
          name: StudyLens-CameraAccess-iPhone-unsigned
          path: ${{ runner.temp }}/StudyLens-CameraAccess-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Archiver l'application compilée
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CameraAccess-iOS-Simulator
          path: ${{ runner.temp }}/CameraAccessBuild/Build/Products/Debug-iphonesimulator/CameraAccess.app
          if-no-files-found: error
          retention-days: 7
